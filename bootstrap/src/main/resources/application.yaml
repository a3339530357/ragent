server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:}
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://127.0.0.1:15432/ragent?client_encoding=UTF8}
    hikari:
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool
      data-source-properties:
        tcpKeepAlive: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ragent-producer${unique-name:}_pg
    send-message-timeout: 2000

milvus:
  uri: ${MILVUS_URI:http://127.0.0.1:19530}

rag:
  vector:
    type: pg  # 可选 milvus / pg

  pdf:
    # PDF OCR 策略：NO_OCR / AUTO / OCR_ONLY。默认不 OCR，避免正常 PDF 性能浪费。
    ocr-strategy: AUTO
    corruption-detection:
      enabled: true
      min-chinese-ratio: 0.05
      max-uppercase-sequence: 15
      min-text-length: 100
      require-chinese-signal: true
    ocr:
      languages: chi_sim+eng
      timeout-seconds: 30
      dpi: 300
    post-ingestion-check:
      enabled: true
      corruption-threshold: 0.8

  default:
    collection-name: rag_default_store
    dimension: 1024
    metric-type: COSINE
    sse-timeout-ms: 300000  # SSE 全局超时（毫秒），默认 5 分钟

  query-rewrite:
    enabled: true
    semantic-validation:
      enabled: true
      min-similarity: 0.8
    short-query:
      max-length: 8

  answer-citation:
    enabled: true

  rerank:
    enabled: true

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 100
    history-token-budget: 80000
    summary-start-turns: 20
    summary-enabled: true
    summary-trigger-token-threshold: 200000
    summary-trigger-context-ratio: 0.7
    summary-min-token-threshold: 20000
    summary-debounce-seconds: 60
    summary-max-chars: 800
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://127.0.0.1:9099

  search:
    channels:
      vector-global:
        enabled: true
        confidence-threshold: 0.6
        single-intent-supplement-threshold: 0.8
        top-k-multiplier: 3
        min-score: 0.55
      intent-directed:
        enabled: true
        min-intent-score: 0.4
        top-k-multiplier: 2
      keyword-es:
        enabled: true
        top-k-multiplier: 3
        min-score: 0.05
        text-search-config: simple
        max-query-terms: 8
        exact-phrase-boost: 0.35
        title-boost: 0.25
        term-boost: 0.08
    filters:
      enabled: true
      enabled-only: true
      success-status-only: true
      user-owned-only: false
      admin-bypass-user-owned: true
      allowed-kb-ids: []
      allowed-doc-ids: []
      recent-days: 0
    fusion:
      enabled: true
      rrf-k: 60
      max-candidates-before-rerank: 50
      channel-weights:
        intent-directed: 1.2
        keyword-es: 1.1
        vector-global: 1.0
    rerank:
      min-score: 0.2
    lost-in-the-middle:
      enabled: true
      min-chunks: 4

  trace:
    enabled: true
    max-error-length: 1000

ai:
  llm-request-log:
    enabled: true
    directory: logs/llm-requests
    include-headers: true
    include-response-body: true
    pretty-print: true

  providers:
    newapi:
      url: ${NEWAPI_BASE_URL:http://127.0.0.1:3000}
      api-key: ${NEWAPI_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
    siliconflow:
      url: https://api.siliconflow.cn/v1
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /chat/completions
        embedding: /embeddings
        rerank: /rerank
    moyu:
      url: https://moyu.info
      api-key: ${MOYU_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
    glm:
      url: http://43.139.76.84:8082
      api-key: ${ZHIPU_API_KEY:}
      format: anthropic
      endpoints:
        chat: /v1/messages
    mimo:
      url: https://token-plan-cn.xiaomimimo.com/anthropic
      api-key: ${MIMO_API_KEY:}
      format: anthropic
      endpoints:
        chat: /v1/messages
    gpt55:
      url: ${GPT55_BASE_URL:}
      api-key: ${GPT55_API_KEY:}
      format: openai
      thinking-parameter: reasoning_effort
      reasoning-effort: medium
      endpoints:
        chat: /v1/chat/completions

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: claude-opus
    deep-thinking-model: claude-opus
    internal-model: claude-opus
    candidates:
      - id: gpt-5.5
        provider: gpt55
        model: gpt-5.5
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: claude-opus
        provider: moyu
        model: claude-opus-4-7
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: claude-opus-newapi
        provider: newapi
        model: claude-opus-4-7
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: glm-5.1
        provider: glm
        model: glm-5.1
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: mimo-v2.5-pro
        provider: mimo
        model: mimo-v2.5-pro
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: minimax-m2.7
        provider: newapi
        model: minimax-m2.7
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: minimax-m2.5
        provider: newapi
        model: minimax-m2.5
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: kimi-k2.6
        provider: newapi
        model: kimi-k2.6
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: kimi-k2.5
        provider: newapi
        model: kimi-k2.5
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: glm-5.1-newapi
        provider: newapi
        model: glm-5.1
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: glm-5
        provider: newapi
        model: glm-5
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: deepseek-v4-pro
        provider: newapi
        model: deepseek-v4-pro
        supports-thinking: true
        max-context-tokens: 1000000
        thinking-parameter: thinking
        priority: 0
      - id: deepseek-v4-flash
        provider: newapi
        model: deepseek-v4-flash
        supports-thinking: true
        max-context-tokens: 1000000
        thinking-parameter: thinking
        priority: 1
      - id: qwen3.6-plus
        provider: newapi
        model: qwen3.6-plus
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: qwen3.5-plus
        provider: newapi
        model: qwen3.5-plus
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: mimo-v2-pro
        provider: newapi
        model: mimo-v2-pro
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: mimo-v2-omni
        provider: newapi
        model: mimo-v2-omni
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: mimo-v2.5-pro-newapi
        provider: newapi
        model: mimo-v2.5-pro
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: mimo-v2.5
        provider: newapi
        model: mimo-v2.5
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1
      - id: hy3-preview
        provider: newapi
        model: hy3-preview
        supports-thinking: true
        max-context-tokens: 200000
        priority: 1

  embedding:
    default-model: bge-m3
    candidates:
      - id: bge-m3
        provider: siliconflow
        model: BAAI/bge-m3
        dimension: ${rag.default.dimension}
        priority: 1

  rerank:
    default-model: bge-reranker-v2-m3
    candidates:
      - id: bge-reranker-v2-m3
        provider: siliconflow
        model: BAAI/bge-reranker-v2-m3
        priority: 1

rustfs:
  url: ${RUSTFS_URL:http://127.0.0.1:9000}
  access-key-id: ${RUSTFS_ACCESS_KEY_ID:}
  secret-access-key: ${RUSTFS_SECRET_ACCESS_KEY:}

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
  eval:
    enabled: true
    execution:
      max-concurrency: 2
      default-trial-count: 5
      timeout-seconds: 120

logging:
  level:
    com.nageoffer.ai.ragent.rag: INFO
