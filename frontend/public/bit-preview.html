<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>比特严选 · 演示数据预览</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e3de;--accent:#0a66c2;
        --ok:#1f7a4d;--warn:#b26a00;--bad:#b42318;--muted:#8a8a8e;--chip:#efede8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:22px 28px 0}
  h1{font-size:20px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 16px}
  .lead b{color:var(--bad);font-weight:600}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
  .stat .n{font-size:20px;font-weight:600}
  .stat .l{color:var(--sub);font-size:12px}
  nav{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  nav button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  nav button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
  main{padding:20px 28px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--chip);color:var(--sub);white-space:nowrap}
  .b-ok{background:#e3f3ea;color:var(--ok)} .b-warn{background:#fdf0dc;color:var(--warn)}
  .b-bad{background:#fde7e5;color:var(--bad)} .b-blue{background:#e6f0fa;color:var(--accent)}
  .muted{color:var(--muted)} .small{font-size:12px}
  .t{font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;color:var(--sub);font-size:12px;white-space:nowrap}
  tr.click{cursor:pointer} tr.click:hover td{background:#faf9f6}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
  .kv span:nth-child(odd){color:var(--sub)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){.two{grid-template-columns:1fr}}
  h3{font-size:13px;margin:14px 0 6px;color:var(--sub);font-weight:600}
  .tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
  .tl div{position:relative;margin-bottom:8px}
  .tl div:before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line)}
  .tl div:last-child:before{background:var(--accent)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:240px;background:#fff}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;cursor:pointer;font:inherit;font-size:13px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sub{background:#faf9f6}
  .sub td{padding:12px 14px}
  pre.note{white-space:pre-wrap;margin:0;font:13px/1.7 inherit;color:var(--ink)}
  .money{font-weight:600}
  del{color:var(--muted)}
</style>
</head>

</header>

const items=by(T.t_order_item,'order_no');
const trace=by(T.t_logistics_trace,'tracking_no');
const asBy=by(T.t_after_sale,'order_no');

const VIEWS={
orders(){return T.t_order.map(o=>{
  const it=items[o.order_no]||[], tr=trace[o.tracking_no]||[], as=asBy[o.order_no]||[];
  return `<div class="card">
    <div class="row"><b>订单 ${esc(o.order_no)}</b>${badge(o.status)}
      ${as.map(a=>`<span class="badge b-warn">售后：${esc(a.type)} · ${esc(a.status)}</span>`).join('')}
      <span class="sp"></span><span class="muted small">实付</span><span class="money">${yuan(o.pay_amount)}</span>
      ${o.discount_amount>0?`<span class="small muted">（原价 <del>${yuan(o.total_amount)}</del>，券 ${esc(o.coupon_code)}）</span>`:''}</div>
    <div class="two" style="margin-top:10px">
      <div>
        <h3>商品</h3>
        <table>${it.map(i=>`<tr><td>${esc(i.sku_name)}<div class="muted small">${esc(i.sku_code)}</div></td>
          <td class="t">× ${i.quantity}</td><td class="t">${yuan(i.price)}</td></tr>`).join('')}</table>
        <h3>收货与时间</h3>
        <div class="kv"><span>收货人</span><span>${esc(o.receiver_name)} ${esc(o.receiver_phone)}</span>
          <span>地址</span><span>${esc(o.receiver_address)}</span>
          <span>下单</span><span>${esc(o.create_time)}</span><span>支付</span><span>${esc(o.pay_time)}</span>
          <span>发货</span><span>${esc(o.ship_time)}</span><span>签收</span><span>${esc(o.receive_time)}</span>
          ${o.cancel_time?`<span>取消</span><span>${esc(o.cancel_time)}</span>`:''}</div>
      </div>
      <div>
        <h3>物流 ${o.tracking_no?esc(o.tracking_no):''}</h3>
        ${tr.length?`<div class="tl">${tr.map(x=>`<div><b>${esc(x.description)}</b> <span class="muted small">${esc(x.location)} · ${esc(x.trace_time)}</span></div>`).join('')}</div>`:'<span class="muted">无物流记录</span>'}
        ${as.map(a=>`<h3>售后 ${esc(a.after_sale_no)}</h3><div class="kv"><span>类型</span><span>${esc(a.type)}</span>
          <span>商品</span><span>${esc(skuBy[a.sku_code]?.name??a.sku_code)}</span><span>原因</span><span>${esc(a.reason)}</span>
          <span>状态</span><span>${badge(a.status)}</span><span>申请</span><span>${esc(a.create_time)}</span>
          <span>完成</span><span>${esc(a.finish_time)}</span></div>`).join('')}
      </div>
    </div></div>`}).join('')},

products(){
  const cats=[...new Set(T.t_product.map(p=>p.category))];
  return `<div class="tools"><input type="search" id="q" placeholder="搜名称、型号、标签…">
    <button class="chip on" data-c="">全部</button>${cats.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
    <label class="small"><input type="checkbox" id="edge"> 只看库存异常 / 下架</label>
    <span class="sp"></span><span class="muted small" id="cnt"></span></div>
    <div class="card" style="padding:0"><table><thead><tr><th>款</th><th>分类</th><th>品牌</th><th>状态</th><th>配置数</th><th>价格</th><th>总库存</th><th>标签</th></tr></thead>
    <tbody id="pb"></tbody></table></div>`},

aftersale(){return `<div class="card" style="padding:0"><table><thead><tr><th>售后单号</th><th>订单</th><th>商品</th><th>类型</th><th>原因</th><th>状态</th><th>申请</th><th>完成</th></tr></thead><tbody>
  ${T.t_after_sale.map(a=>`<tr><td>${esc(a.after_sale_no)}</td><td>${esc(a.order_no)}</td><td>${esc(skuBy[a.sku_code]?.name??a.sku_code)}</td>
  <td>${esc(a.type)}</td><td>${esc(a.reason)}</td><td>${badge(a.status)}</td><td>${esc(a.create_time)}</td><td>${esc(a.finish_time)}</td></tr>`).join('')}
  </tbody></table></div>`},

cart(){return `<div class="card" style="padding:0"><table><thead><tr><th>商品</th><th>数量</th><th>加购价</th><th>现价</th><th>差价</th><th>库存</th><th>状态</th><th>加购</th></tr></thead><tbody>
  ${T.t_cart.map(c=>{const s=skuBy[c.sku_code]||{};const d=(s.price??0)-c.added_price;
  return `<tr><td>${esc(s.name??c.sku_code)}<div class="muted small">${esc(c.sku_code)}</div></td><td class="t">${c.quantity}</td>
  <td class="t">${yuan(c.added_price)}</td><td class="t">${yuan(s.price)}</td>
  <td class="t">${Math.abs(d)<0.005?'<span class="muted">—</span>':d<0?`<span class="badge b-ok">降 ${yuan(-d)}</span>`:`<span class="badge b-warn">涨 ${yuan(d)}</span>`}</td>
  <td>${stock(s.stock)}</td><td>${badge(s.status)}</td><td>${esc(c.create_time)}</td></tr>`}).join('')}
  </tbody></table></div>`},

coupons(){return `<div class="card" style="padding:0"><table><thead><tr><th>券码</th><th>名称</th><th>类型</th><th>门槛</th><th>优惠</th><th>限品类</th><th>生效</th><th>失效</th></tr></thead><tbody>
  ${T.t_coupon.map(c=>`<tr><td>${esc(c.coupon_code)}</td><td>${esc(c.name)}</td><td>${esc(c.type)}</td>
  <td class="t">${c.threshold?yuan(c.threshold):'无门槛'}</td>
  <td class="t">${c.type==='折扣'?(c.discount_value*10).toFixed(1).replace(/\.0$/,'')+' 折':yuan(c.discount_value)}</td>
  <td>${esc(c.category)}</td><td>${esc(c.valid_from)}</td><td>${String(c.valid_to).includes('前')?`<span class="badge b-bad">${esc(c.valid_to)} 已过期</span>`:esc(c.valid_to)}</td></tr>`).join('')}
  </tbody></table></div>`},

mycoupons(){return `<div class="card" style="padding:0"><table><thead><tr><th>券码</th><th>名称</th><th>状态</th><th>用于订单</th><th>使用时间</th></tr></thead><tbody>
  ${T.t_user_coupon.map(u=>`<tr><td>${esc(u.coupon_code)}</td><td>${esc(couponBy[u.coupon_code]?.name)}</td><td>${badge(u.status)}</td>
  <td>${esc(u.order_no)}</td><td>${esc(u.use_time)}</td></tr>`).join('')}</tbody></table></div>`},

notes(){return Object.entries(D.notes).map(([f,n])=>`<div class="card"><div class="row"><b>${esc(f)}</b></div>
  <pre class="note">${esc(n.join('\n'))}</pre></div>`).join('')+
  `<div class="card"><b>工单 t_ticket</b><pre class="note">数据集没有工单演示数据，灌入后这张表仍为空。
工单由 Agent 对话中的「提交工单」工具产生，后续工单系统改造（见 docs/ticket/02-domain-design.md）会在这里补演示数据。</pre></div>`}
};

const BIND={products(){
  let cat='';
  const rows=T.t_product.map(p=>{const ss=skusOf[p.spu_code]||[];const pr=ss.map(s=>s.price);
    const st=ss.reduce((a,s)=>a+s.stock,0);
    const edge=p.status!=='在售'||ss.some(s=>s.stock<=3||s.status!=='在售');
    return {p,ss,min:Math.min(...pr),max:Math.max(...pr),st,edge,
      text:(p.name+p.spu_code+(p.tags||'')+(p.sub_category||'')+ss.map(s=>s.name+s.sku_code).join('')).toLowerCase()}});
  const render=()=>{
    const q=$('#q').value.trim().toLowerCase(), e=$('#edge').checked;
    const list=rows.filter(r=>(!cat||r.p.category===cat)&&(!q||r.text.includes(q))&&(!e||r.edge));
    $('#cnt').textContent=`${list.length} 款`;
    $('#pb').innerHTML=list.slice(0,300).map((r,i)=>`<tr class="click" data-i="${rows.indexOf(r)}">
      <td><b>${esc(r.p.name)}</b><div class="muted small">${esc(r.p.spu_code)} · ${esc(r.p.sub_category)}</div></td>
      <td>${esc(r.p.category)}</td><td>${esc(r.p.brand)}<div class="muted small">${esc(r.p.brand_owner)}</div></td>
      <td>${badge(r.p.status)}</td><td class="t">${r.ss.length}</td>
      <td class="t">${r.ss.length?(r.min===r.max?yuan(r.min):yuan(r.min)+' – '+yuan(r.max)):'—'}</td>
      <td>${stock(r.st)}</td><td class="small">${esc(r.p.tags)}</td></tr>`).join('')+
      (list.length>300?`<tr><td colspan="8" class="muted">只显示前 300 款，请用搜索或分类缩小范围</td></tr>`:'');
  };
  $('#q').oninput=render; $('#edge').onchange=render;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()});
  $('#pb').onclick=ev=>{const tr=ev.target.closest('tr.click');if(!tr)return;
    if(tr.nextElementSibling?.classList.contains('sub')){tr.nextElementSibling.remove();return}
    const r=rows[tr.dataset.i];
    tr.insertAdjacentHTML('afterend',`<tr class="sub"><td colspan="8">
      <div class="kv" style="margin-bottom:8px"><span>卖点</span><span>${esc(r.p.selling_point)}</span><span>规格</span><span>${specs(r.p.specs)}</span></div>
      <table><thead><tr><th>配置</th><th>型号</th><th>差异规格</th><th>价格</th><th>库存</th><th>状态</th></tr></thead><tbody>
      ${r.ss.map(s=>`<tr><td>${esc(s.name)}</td><td class="small">${esc(s.sku_code)}</td><td class="small">${specs(s.specs)}</td>
      <td class="t">${yuan(s.price)}</td><td>${stock(s.stock)}</td><td>${badge(s.status)}</td></tr>`).join('')}</tbody></table></td></tr>`)};
  render();
}};

show((location.hash||'#orders').slice(1) in VIEWS?(location.hash||'#orders').slice(1):'orders');
</script>
</body>
</html>
